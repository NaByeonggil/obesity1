<script>
        // Simple micro-interaction for cards and buttons
        document.querySelectorAll('button, .bg-surface-container-lowest').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.98)';
            });
            el.addEventListener('touchend', () => {
                el.style.transform = 'scale(1)';
            });
        });

        // Filter chip selection logic
        const chips = document.querySelectorAll('section.overflow-x-auto button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary');
                    c.classList.add('bg-primary-container/20', 'text-primary');
                });
                chip.classList.add('bg-primary', 'text-on-primary');
                chip.classList.remove('bg-primary-container/20', 'text-primary');
            });
        });
    </script>
